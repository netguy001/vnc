version: '3.8'

services:
  # -------------------------------------------------------------
  # ServerConsole Backend API & WebSocket Proxy
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: server-console-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - FRONTEND_URL=http://localhost
      - MASTER_KEY=${MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - JWT_SECRET=${JWT_SECRET:-server_console_super_secret_jwt_key_min_32_chars!}
      - DATABASE_PATH=/app/apps/server/data/server_console.sqlite
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/apps/server/data
    networks:
      - console-network

  # -------------------------------------------------------------
  # ServerConsole Web Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: server-console-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - console-network

  # -------------------------------------------------------------
  # Reverse Proxy (Nginx with WebSockets & SSL Termination)
  # -------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: server-console-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - console-network

  # -------------------------------------------------------------
  # Disposable Local Linux / VNC / SSH Test Server (Optional)
  # Run with: docker compose --profile test up
  # -------------------------------------------------------------
  test-vnc:
    build:
      context: ./docker/test-vnc
      dockerfile: Dockerfile
    container_name: server-console-test-server
    profiles:
      - test
    ports:
      - "5900:5900"
      - "2222:22"
    environment:
      - VNC_PASSWORD=secret
      - SSH_PASSWORD=secret
    networks:
      - console-network

networks:
  console-network:
    driver: bridge
